---
- name: Install Podman and podman-compose
  block:
    - name: Install Podman (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - podman
          - uidmap
          - slirp4netns
          - podman-compose
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Enable EPEL repository (podman-compose is not in RHEL base repos)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Install Podman (Oracle Linux / RHEL)
      ansible.builtin.dnf:
        name:
          - podman
          - podman-docker
          - container-selinux
          - podman-compose
        state: present
      when: ansible_facts["os_family"] == "RedHat"

- name: Open HTTP/HTTPS ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ nginx_http_port }}"
    - "{{ nginx_https_port }}"
  when: ansible_facts["os_family"] == "RedHat"

- name: Allow rootless podman to bind privileged ports (80/443)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    state: present
    reload: true

- name: Enable lingering for rootless user (boot persistence)
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user }}"
  changed_when: false

- name: Enable Podman user socket
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
    scope: user
  become: false
