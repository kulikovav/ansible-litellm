---
# =============================================================================
# LiteLLM standalone deployment (Podman) — matches beekube Terraform litellm.tf
# =============================================================================

litellm_domain: "{{ vault_litellm_domain }}"

# Rootless user home (connection user). Facts are gathered under become (root),
# so ansible_facts['env'].HOME points at /root; use this instead for user-scoped paths.
litellm_user_home: "/home/{{ ansible_user }}"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
litellm_base_dir: "/opt/litellm"
litellm_config_dir: "{{ litellm_base_dir }}/config"
litellm_data_dir: "{{ litellm_base_dir }}/data"
litellm_acme_dir: "{{ litellm_base_dir }}/acme"

# Host nginx reverse proxy (the host already runs nginx serving other sites).
litellm_nginx_conf: "/etc/nginx/conf.d/litellm.conf"

# ---------------------------------------------------------------------------
# Container images
# ---------------------------------------------------------------------------
# LiteLLM image, pinned to a release tag so upgrades and rollbacks are explicit.
# Bump this line to move to a new release; the rolling "latest" tag pointed at
# v1.101.0 when this pin was set.
litellm_image: "ghcr.io/berriai/litellm-database:v1.104.0"
postgres_image: "docker.io/library/postgres:16-alpine"
redis_image: "docker.io/library/redis:7-alpine"

# ---------------------------------------------------------------------------
# Ports (host bindings)
# ---------------------------------------------------------------------------
nginx_http_port: 80
nginx_https_port: 443
litellm_port: 4000

# ---------------------------------------------------------------------------
# Nginx access control — the site root is restricted to these IPs. The /v1 API
# answers from any IP over HTTPS, and the acme.sh HTTP-01 challenge path stays
# open for Let's Encrypt validation.
# ---------------------------------------------------------------------------
litellm_allowed_ips: "{{ vault_litellm_allowed_ips }}"

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
postgres_db: "litellm"
postgres_user: "litellm"
postgres_password: "{{ vault_postgres_password }}"

# ---------------------------------------------------------------------------
# Redis (AOF persistence, matching Terraform redis commonConfiguration)
# ---------------------------------------------------------------------------
redis_password: "{{ vault_redis_password }}"
redis_appendonly: "yes"
redis_appendfsync: "always"
redis_save: '""'

# ---------------------------------------------------------------------------
# LiteLLM proxy settings — mirror of variables_litellm.tf defaults
# ---------------------------------------------------------------------------
litellm_master_key: "{{ vault_litellm_master_key }}"
litellm_request_timeout: 3600
litellm_cache_ttl: 259200
litellm_db_connection_pool_limit: 8
litellm_proxy_batch_write_interval: 60

# Headroom pre-call guardrail endpoint — local headroom service in the compose network.
litellm_headroom_api_base: "http://headroom:8787"

# ---------------------------------------------------------------------------
# Headroom compression proxy — matches beekube headroom.tf
# Opt-in: the sidecar pod and its guardrail are skipped unless this is true.
# ---------------------------------------------------------------------------
headroom_enabled: false
headroom_image: "ghcr.io/headroomlabs-ai/headroom:0.35.0"
headroom_port: 8787
headroom_mode: "cache"
headroom_backend: "litellm-openai"
headroom_target_api_url: "http://litellm:4000/v1"
headroom_workspace_dir: "/home/nonroot/.headroom"
headroom_config_dir: "/home/nonroot/.headroom/config"
headroom_proxy_token: "{{ vault_headroom_proxy_token }}"

# ---------------------------------------------------------------------------
# LiteLLM model catalog (rendered as config.yaml model_list)
# ---------------------------------------------------------------------------
# Caps are identical for every provider of a model, costs differ per provider.
# litellm_model_list entries name their costs provider in costs_provider; the
# template combines that provider's costs with the model's caps and the
# health-check pins (costs first) into the rendered model_info block. An
# entry's own model_info block is merged over that generated block.
# Costs are USD per token.
#
# The real catalog for this deployment lives in vars_local.yml (gitignored,
# same directory, auto-loaded by Ansible after this file, overrides these
# examples).
# The values below are placeholders, not live data.
# ponytail: examples are not a deployable catalog (one fake model, one fake
# provider); copy the real data to vars.local.yml before a real deployment.
litellm_model_caps:
  example-model:
    max_input_tokens: 1000000
    max_output_tokens: 64000
    max_tokens: 64000
    mode: chat
    supports_function_calling: true
    supports_reasoning: true
    supports_tool_choice: true
    supports_prompt_caching: true

litellm_model_costs:
  exampleprovider:
    example-model:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.0000001

# Health probe caps applied to every generated model_info. LiteLLM picks the
# 128/16 tier from its internal model registry only when the deployment string
# is listed there, so pin the tier per model_info to make it deterministic.
litellm_health_check_tokens:
  health_check_max_tokens_reasoning: 128
  health_check_max_tokens_non_reasoning: 16

# OpenCode Go rejects requests without a stable x-opencode-session header
# (https://opencode.ai/docs/go/#where-can-i-use-it). The config template injects
# this into every model_list entry whose api_base points at /zen/go.
# ponytail: one global session, not one per client conversation; satisfies Go's
# routing check. Upgrade to per-request passthrough if Go rejects shared sessions.
opencode_session_id: "bleenk-litellm"

# Deployment list, in routing order. Entries without a costs provider (hosted
# vLLM, OpenRouter) carry a literal model_info or none at all.
litellm_model_list:
  - model_name: example-model
    costs_provider: exampleprovider
    litellm_params:
      model: exampleprovider/example-model
      api_key: os.environ/EXAMPLE_API_KEY
      api_base: https://api.example.com/v1
      stream: true
      order: 1

# ---------------------------------------------------------------------------
# Provider API keys (os.environ references in config.yaml)
# ---------------------------------------------------------------------------
opencode_api_key: "{{ vault_opencode_api_key }}"
cline_api_key: "{{ vault_cline_api_key }}"
commandcode_api_key: "{{ vault_commandcode_api_key }}"
commandcode2_api_key: "{{ vault_commandcode2_api_key }}"
openrouter_api_key: "{{ vault_openrouter_api_key }}"
exa_api_key: "{{ vault_exa_api_key }}"
firecrawl_api_key: "{{ vault_firecrawl_api_key }}"
headroom_api_key: "{{ vault_headroom_api_key }}"
context7_api_key: "{{ vault_context7_api_key }}"
ollama_api_key: "{{ vault_ollama_api_key }}"

# ---------------------------------------------------------------------------
# Resend email notifications (resend_email callback)
# ---------------------------------------------------------------------------
resend_api_key: "{{ vault_resend_api_key }}"
resend_from_email: "{{ vault_resend_from_email }}"

# ---------------------------------------------------------------------------
# acme.sh (HTTP-01 webroot)
# ---------------------------------------------------------------------------
acme_email: "{{ vault_acme_email }}"
acme_webroot: "{{ litellm_acme_dir }}/webroot"
